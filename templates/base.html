<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Video Manager{% endblock %}</title>
    <script src="/templates/theme.js?v=20260908-2"></script>
    <link rel="stylesheet" href="/templates/style.css?v=20261004-1">
    <script src="/templates/app.js?v=20260913-1" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要內容</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/" aria-label="Video Manager 首頁">
                <span class="brand-mark" aria-hidden="true">VM</span>
                <span><strong>Video Manager</strong><small>你的媒體工作區</small></span>
            </a>
            <nav class="primary-nav" aria-label="主要導覽">
                <a href="/" class="nav-link{{ ' active' if page == 'local' }}"{% if page == 'local' %} aria-current="page"{% endif %}>
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2H18.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></svg><span>本機媒體</span>
                </a>
                <a href="/cloud" class="nav-link{{ ' active' if page == 'cloud' }}"{% if page == 'cloud' %} aria-current="page"{% endif %}>
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 19a5.5 5.5 0 0 1-.6-10.97A6.5 6.5 0 0 1 19.3 10.1 4.5 4.5 0 0 1 18.5 19z"/></svg><span>雲端媒體</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="切換顯示主題">
                    <svg class="theme-icon-light" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0-6h1v3h-2V2zm0 17h1v3h-2v-3zM2 11h3v2H2zm17 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg>
                    <svg class="theme-icon-dark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.3A8.5 8.5 0 0 1 8.7 3.5 9 9 0 1 0 20.5 15.3"/></svg>
                    <span data-theme-label>深色模式</span>
                </button>
            </div>
        </aside>
        <header class="mobile-header">
            <a class="brand compact" href="/" aria-label="Video Manager 首頁"><span class="brand-mark" aria-hidden="true">VM</span><strong>Video Manager</strong></a>
            <button class="icon-button" type="button" data-theme-toggle aria-label="切換顯示主題">
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m0 18V4a8 8 0 0 1 0 16"/></svg><span class="sr-only" data-theme-label>深色模式</span>
            </button>
        </header>
        <main id="main-content" class="main-content" tabindex="-1"><div class="content-container">{% block content %}{% endblock %}<footer class="site-footer"><span>VIDEO MANAGER</span><span>LOCAL × CLOUD</span></footer></div></main>
        <nav class="mobile-nav" aria-label="行動版主要導覽">
            <a href="/" class="mobile-nav-link{{ ' active' if page == 'local' }}"{% if page == 'local' %} aria-current="page"{% endif %}><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2H18.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></svg><span>本機</span></a>
            <a href="/cloud" class="mobile-nav-link{{ ' active' if page == 'cloud' }}"{% if page == 'cloud' %} aria-current="page"{% endif %}><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 19a5.5 5.5 0 0 1-.6-10.97A6.5 6.5 0 0 1 19.3 10.1 4.5 4.5 0 0 1 18.5 19z"/></svg><span>雲端</span></a>
        </nav>
    </div>
</body>
</html>
